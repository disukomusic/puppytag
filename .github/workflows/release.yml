name: Release Extension Builds

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Package Extensions
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Add this step to install pnpm
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm' # Change cache target to pnpm

      - name: Install dependencies
        run: pnpm install # Use pnpm instead of npm ci

      - name: Build & Package Chrome (MV3)
        run: pnpm run package:chrome

      - name: Build & Package Firefox
        run: pnpm run package:firefox

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.zip
          generate_release_notes: true